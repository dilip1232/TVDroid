name: CI

on:
  push:
    branches: [main, dev, feature/*]
    paths-ignore: ['**.md', 'docs/**']
  # No paths-ignore for pull requests: the checks are required to merge into main.
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run of the same branch. macOS minutes are expensive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Check the shell scripts ──
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck setup.sh build.sh

  # ── Build and check the macOS app ──
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build app and DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh --dmg

      - name: Check app bundle
        run: |
          plutil -lint build/TVDroid.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/TVDroid.app
          file build/TVDroid.app/Contents/MacOS/TVDroid
          test -s build/TVDroid.app/Contents/Resources/AppIcon.icns

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tvdroid-macos
          path: build/TVDroid-*.dmg
          retention-days: 14
